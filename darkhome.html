<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Manager</title>
    <link rel="stylesheet" href="darkhome.css">
</head>

<body class="darkmode">

<div class="finals">

    <div>
        <button class="dark mode">
            <a href="home.html" class="dark">
                Switch to light mode
            </a>
        </button>
    </div>

        <div class="container">

        <div class="header">
            <div class="logo"> 
                <h1 class="manager">📁File Manager</h1>
            </div>
            <p class="whitner">Move your files easily and securely</p>
        </div>

        <div class="file-card">

            <h2>Move a File</h2>
            <p class="description">
                Enter the current location of the file and where you want to move it.
            </p>

            <div class="form-group">
                <label for="currentPath">Current File Location</label>

                <div class="input-box">
                    <span>📄</span>
                    <input 
                        type="text" 
                        id="currentPath"
                        placeholder="C:\Users\Name\Documents\file.pdf"
                    >
                </div>
            </div>


            <div class="arrow">
                ↓
            </div>


            <div class="form-group">
                <label for="destinationPath">Destination Location</label>

                <div class="input-box">
                    <span>📁</span>
                    <input 
                        type="text" 
                        id="destinationPath"
                        placeholder="C:\Users\Name\Desktop"
                    >
                </div>
            </div>


            <button class="move-btn">
                Move File
            </button>

        </div>
</div>


       
</body>
</html>
